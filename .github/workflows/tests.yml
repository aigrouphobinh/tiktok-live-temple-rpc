name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  character-state-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Run unit tests
        run: bun test
      - name: Check server-side JavaScript syntax
        run: node --check server.js && node --check lib/tiktok-gift-payload.cjs
